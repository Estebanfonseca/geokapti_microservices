[tool.poetry]
name = "project-geokapti"
version = "0.1.0"
description = "Microservices for registering geospatial locations and calculating distances"
authors = ["Estebanfonseca <estebanfonsecadev@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
flask = "^3.1.3"
redis = "^5.2.0"
structlog = "^24.4.0"
pika = "^1.3.2"
flask-smorest = "^0.45.0"
marshmallow = ">=3.26.2,<4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"

[tool.pytest.ini_options]
testpaths = ["location_service/test", "distance_service/test"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
